name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27 toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test FormaDS
        run: |
          xcodebuild test \
            -scheme FormaDS \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES

      - name: Build FormaDSShowcase
        run: |
          xcodebuild build \
            -project Showcase/FormaDSShowcase/FormaDSShowcase.xcodeproj \
            -scheme FormaDSShowcase \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
